spring.application.name=Secure Chat Application with E2EE

# Server
server.port=8080

# H2 Database
spring.datasource.url=jdbc:h2:mem:securechatdb
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# JPA
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false

# WebSocket
spring.websocket.max-text-message-size=65536
spring.websocket.max-binary-message-size=65536

# Logging
logging.level.com.securechat=INFO
logging.level.org.springframework.web.socket=INFO
